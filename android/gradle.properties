# Project-wide Gradle settings.

# IDE (or command line) options
# Specifies the JVM arguments used for the Gradle Daemon.
# Increased memory allocation to prevent OutOfMemoryError during build & dexing tasks.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Kotlin daemon JVM options
kotlin.daemon.jvmargs=-Xmx2048m

# AndroidX package structure enabled
android.useAndroidX=true

# Enables parallel execution of tasks
org.gradle.parallel=true

# Enables Gradle build caching
org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
